<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生成结果 - 早鸟天筹明细生成器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 960px;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 8px;
        }
        p.desc {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .all-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #1a7f37;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-bottom: 24px;
        }
        .all-btn:hover { background: #136c2e; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e1e4e8;
        }
        th {
            background: #f6f8fa;
            font-weight: 600;
            color: #555;
        }
        td a {
            color: #0969da;
            text-decoration: none;
            font-weight: 500;
        }
        td a:hover { text-decoration: underline; }
        .back {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #666;
            font-size: 14px;
        }
        .error {
            color: #cf222e;
            font-size: 13px;
        }
        .filename-cell {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .filename-text {
            color: #555;
            font-size: 13px;
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rename-form {
            display: none;
            align-items: center;
            gap: 6px;
        }
        .rename-form input {
            width: 120px;
            padding: 4px 8px;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            font-size: 13px;
        }
        .rename-form button {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .rename-form .btn-ok {
            background: #0969da;
            color: #fff;
        }
        .rename-form .btn-cancel {
            background: #eaeef2;
            color: #333;
        }
        .rename-link {
            color: #666;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>文档生成完成</h1>
        <p class="desc">共生成 {{ results|length }} 个文档</p>
        <a href="/download/all" class="all-btn">打包下载全部</a>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-bottom:12px;">
            <button id="stop-server" class="all-btn" style="background:#d64545; width:160px">停止后端服务</button>
        </div>
        <table>
            <tr>
                <th>受托方</th>
                <th>记录数</th>
                <th>总金额</th>
                <th>文件名</th>
                <th>操作</th>
            </tr>
            {% for r in results %}
            <tr>
                <td>{{ r.party }}</td>
                <td>{{ r.records }} 条</td>
                <td>{{ r.total }} 元</td>
                <td>
                    <div class="filename-cell" id="cell-{{ loop.index }}">
                        <span class="filename-text" id="name-{{ loop.index }}">{{ r.filename }}</span>
                        <span class="rename-link" onclick="showRename({{ loop.index }})">重命名</span>
                        <form class="rename-form" id="form-{{ loop.index }}" action="/rename/{{ r.filename }}" method="post">
                            <input type="text" name="new_name" value="{{ r.filename }}" required>
                            <button type="submit" class="btn-ok">确认</button>
                            <button type="button" class="btn-cancel" onclick="hideRename({{ loop.index }})">取消</button>
                        </form>
                    </div>
                </td>
                <td>
                    {% if r.path %}
                    <a href="/preview/{{ r.filename }}">预览</a>
                    <a href="/edit/{{ r.filename }}">编辑</a>
                    <a href="/download/{{ r.filename }}">下载</a>
                    {% else %}
                    <span class="error">{{ r.error }}</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </table>
        <a href="/" class="back">← 返回重新上传</a>
    </div>

    <script>
        function showRename(index) {
            document.getElementById('name-' + index).style.display = 'none';
            document.querySelector('#cell-' + index + ' .rename-link').style.display = 'none';
            document.getElementById('form-' + index).style.display = 'flex';
        }
        function hideRename(index) {
            document.getElementById('name-' + index).style.display = 'inline';
            document.querySelector('#cell-' + index + ' .rename-link').style.display = 'inline';
            document.getElementById('form-' + index).style.display = 'none';
        }
    </script>
    <script>
        document.getElementById('stop-server').addEventListener('click', function() {
            if (!confirm('确认停止后端服务？页面会断开，后端进程将退出。')) return;
            fetch('/shutdown', { method: 'POST' })
                .then(r => r.text())
                .then(txt => alert(txt))
                .catch(e => alert('请求失败: ' + e));
        });
    </script>
</body>
</html>
