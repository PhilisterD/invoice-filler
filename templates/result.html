<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生成结果 - 早鸟天筹明细生成器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 640px;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 8px;
        }
        p.desc {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .all-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #1a7f37;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-bottom: 24px;
        }
        .all-btn:hover { background: #136c2e; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e1e4e8;
        }
        th {
            background: #f6f8fa;
            font-weight: 600;
            color: #555;
        }
        td a {
            color: #0969da;
            text-decoration: none;
            font-weight: 500;
        }
        td a:hover { text-decoration: underline; }
        .back {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #666;
            font-size: 14px;
        }
        .error {
            color: #cf222e;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>文档生成完成</h1>
        <p class="desc">共生成 {{ results|length }} 个文档</p>
        <a href="/download/all" class="all-btn">打包下载全部</a>
        <table>
            <tr>
                <th>受托方</th>
                <th>记录数</th>
                <th>总金额</th>
                <th>操作</th>
            </tr>
            {% for r in results %}
            <tr>
                <td>{{ r.party }}</td>
                <td>{{ r.records }} 条</td>
                <td>{{ r.total }} 元</td>
                <td>
                    {% if r.path %}
                    <a href="/preview/{{ r.filename }}">预览</a>
                    <a href="/edit/{{ r.filename }}">编辑</a>
                    <a href="/download/{{ r.filename }}">下载</a>
                    {% else %}
                    <span class="error">{{ r.error }}</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </table>
        <a href="/" class="back">← 返回重新上传</a>
    </div>
</body>
</html>
