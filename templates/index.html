<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>明细生成器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 480px;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 8px;
            color: #333;
        }
        p.desc {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .field {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed #d0d7de;
            border-radius: 8px;
            background: #fafbfc;
            cursor: pointer;
            font-size: 14px;
        }
        input[type="file"]:hover {
            border-color: #0969da;
            background: #f0f6ff;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #0969da;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { background: #0550ae; }
        .template-options {
            display: flex;
            gap: 10px;
        }
        .template-option {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            border: 2px solid #d0d7de;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 400;
            transition: all 0.15s;
        }
        .template-option:hover {
            border-color: #0969da;
            background: #f0f6ff;
        }
        .template-option input[type="radio"]:checked + span {
            color: #0969da;
            font-weight: 600;
        }
        .template-option:has(input[type="radio"]:checked) {
            border-color: #0969da;
            background: #f0f6ff;
        }
        #custom-upload input[type="file"] {
            margin-top: 0;
        }
        .tips {
            margin-top: 20px;
            padding: 14px;
            background: #fff8c5;
            border-radius: 8px;
            font-size: 13px;
            color: #7d4e00;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>明细生成器</h1>
        <p class="desc">上传 Excel 明细表，选择模板，自动生成填充好的文档</p>
        <form action="/process" method="post" enctype="multipart/form-data">
            <div class="field">
                <label for="excel">上传 Excel 明细表</label>
                <input type="file" name="excel" id="excel" accept=".xlsx,.xls" required>
            </div>
            <div class="field">
                <label>选择模板</label>
                <div class="template-options">
                    <label class="template-option">
                        <input type="radio" name="template" value="早鸟天筹明细-模板1.docx" checked>
                        <span>早鸟天筹</span>
                    </label>
                    <label class="template-option">
                        <input type="radio" name="template" value="上海辉研明细-模板1.docx">
                        <span>上海辉研</span>
                    </label>
                    <label class="template-option">
                        <input type="radio" name="template" value="狮山辉研明细-模板1.docx">
                        <span>狮山辉研</span>
                    </label>
                    <label class="template-option">
                        <input type="radio" name="template" value="__custom__" id="custom-radio">
                        <span>自定义</span>
                    </label>
                </div>
                <div id="custom-upload" style="display:none; margin-top:10px;">
                    <input type="file" name="custom_template" id="custom-template" accept=".docx">
                </div>
            </div>
            <button type="submit" class="btn">生成文档</button>
        </form>
        <div style="margin-top:12px; display:flex; gap:8px;">
            <button id="stop-server" class="btn" style="background:#d64545">停止后端服务</button>
            <a href="/log" class="btn" style="background:#334155; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">查看运行日志</a>
            <span style="align-self:center;color:#666;font-size:13px;">（停止会关闭本机后端，关闭后请重启 exe）</span>
        </div>
        <div class="tips">
            <strong>使用说明：</strong><br>
            1. Excel 中需包含"姓名"、"委托方"、"服务内容"、"数量"、"单价"、"合计"列<br>
            2. 相同"委托方"的记录会自动合并到一个 Word 文档<br>
            3. 生成后可在结果页重命名文件名
        </div>
    </div>
    <script>
        const radios = document.querySelectorAll('input[name="template"]');
        const customUpload = document.getElementById('custom-upload');
        const customFile = document.getElementById('custom-template');
        radios.forEach(r => {
            r.addEventListener('change', () => {
                customUpload.style.display = r.value === '__custom__' && r.checked ? 'block' : 'none';
                if (r.value === '__custom__' && r.checked) {
                    customFile.click();
                }
            });
        });
        // form submit validation
        document.querySelector('form').addEventListener('submit', function(e) {
            const sel = document.querySelector('input[name="template"]:checked');
            if (sel && sel.value === '__custom__' && !customFile.files.length) {
                e.preventDefault();
                alert('请选择自定义模板文件');
            }
        });

        document.getElementById('stop-server').addEventListener('click', function() {
            if (!confirm('确认停止后端服务？\n页面会断开，后端进程将退出。')) return;
            fetch('/shutdown', { method: 'POST' })
                .then(r => r.text())
                .then(txt => alert(txt))
                .catch(e => alert('请求失败: ' + e));
        });
    </script>
</body>
</html>
