<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>早鸟天筹明细生成器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 480px;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 8px;
            color: #333;
        }
        p.desc {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .field {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed #d0d7de;
            border-radius: 8px;
            background: #fafbfc;
            cursor: pointer;
            font-size: 14px;
        }
        input[type="file"]:hover {
            border-color: #0969da;
            background: #f0f6ff;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #0969da;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { background: #0550ae; }
        .tips {
            margin-top: 20px;
            padding: 14px;
            background: #fff8c5;
            border-radius: 8px;
            font-size: 13px;
            color: #7d4e00;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>早鸟天筹明细生成器</h1>
        <p class="desc">上传 Excel 明细表和 Word 模板，自动生成填充好的文档</p>
        <form action="/process" method="post" enctype="multipart/form-data">
            <div class="field">
                <label for="excel">1. 上传 Excel 明细表</label>
                <input type="file" name="excel" id="excel" accept=".xlsx,.xls" required>
            </div>
            <div class="field">
                <label for="template">2. 上传 Word 模板</label>
                <input type="file" name="template" id="template" accept=".docx" required>
            </div>
            <button type="submit" class="btn">生成文档</button>
        </form>
        <div class="tips">
            <strong>使用说明：</strong><br>
            1. Excel 中需包含"受托方"、"服务内容"、"数量"、"单价"、"合计"列<br>
            2. 相同"受托方"的记录会自动合并到一个 Word 文档<br>
            3. Word 模板中标黄的部分会被自动替换
        </div>
    </div>
</body>
</html>
