<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>运行日志 - 早鸟天筹明细生成器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            min-height: 100vh;
            padding: 32px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            overflow: hidden;
        }
        .header {
            padding: 24px 28px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        h1 {
            font-size: 22px;
            margin: 0;
        }
        .sub {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 6px;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-primary { background: #2563eb; }
        .btn-secondary { background: #334155; }
        .content {
            padding: 20px 28px 28px;
        }
        .log-box {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 18px;
            overflow: auto;
            max-height: 72vh;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 13px;
            line-height: 1.7;
        }
        .empty {
            color: #94a3b8;
        }
        .hint {
            margin-top: 14px;
            color: #94a3b8;
            font-size: 12px;
        }
        code {
            background: rgba(148,163,184,0.12);
            padding: 2px 6px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>运行日志</h1>
                <div class="sub">日志文件：{{ log_file }}</div>
            </div>
            <div class="actions">
                <a class="btn btn-primary" href="/">返回首页</a>
                <a class="btn btn-secondary" href="/result">查看结果页</a>
            </div>
        </div>
        <div class="content">
            <div class="log-box">{{ log_text|e }}</div>
            <div class="hint">你也可以直接打开 <code>http://localhost:5001/log</code> 查看最近日志。</div>
        </div>
    </div>
</body>
</html>
